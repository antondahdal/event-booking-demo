<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Front End is Vibe Coded</title>
  <meta name="description" content="Front end for the Event Booking platform. The browser talks only to the API gateway." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@380;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="mark" href="#shows" data-nav="shows">Event Booking</a>
      <nav class="nav">
        <a href="#shows" data-nav="shows">Shows</a>
        <a href="#how" data-nav="how">How a book runs</a>
        <a href="#tickets" data-nav="tickets">My tickets</a>
      </nav>
      <p class="who" id="who"></p>
      <button class="ghost" id="account-btn" type="button">Sign in</button>
      <p class="subject">Front End is Vibe Coded</p>
    </header>

    <div class="rail" id="rail" aria-label="Services"></div>

    <div class="stage">
      <main id="view"></main>
      <aside class="trace" aria-live="polite">
        <p class="kicker">This click</p>
        <h2>Who ran</h2>
        <ol id="trace"></ol>
      </aside>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
